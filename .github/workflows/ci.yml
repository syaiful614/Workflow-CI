name: CI Pipeline - Train & Deploy Model

on:
  push:
    branches: [main, master]
    paths:
      - 'MLProject/**'
  workflow_dispatch:
    inputs:
      n_estimators:
        description: 'n_estimators'
        required: false
        default: '200'
      max_depth:
        description: 'max_depth'
        required: false
        default: '8'

jobs:
  train-and-build:
    runs-on: ubuntu-latest
    name: Train Model + Build Docker Image

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Install dependencies
        run: |
          pip install mlflow==2.19.0 scikit-learn pandas numpy matplotlib seaborn

      - name: Train model with MLflow
        run: |
          mlflow run MLProject --env-manager=local \
            -P n_estimators=${{ github.event.inputs.n_estimators || '200' }} \
            -P max_depth=${{ github.event.inputs.max_depth || '8' }}
        env:
          MLFLOW_TRACKING_URI: mlruns

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts-${{ github.run_id }}
          path: mlruns/
          retention-days: 30

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-model:latest

      - name: Summary
        run: |
          echo "## CI Pipeline Completed" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Train Model | Done |" >> $GITHUB_STEP_SUMMARY
          echo "| Upload Artifacts | Done |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build & Push | Done |" >> $GITHUB_STEP_SUMMARY
          echo "Docker: \`${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-model:latest\`" >> $GITHUB_STEP_SUMMARY
