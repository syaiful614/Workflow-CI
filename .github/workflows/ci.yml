name: CI Pipeline - Train & Deploy Model

on:
  push:
    branches: [main, master]
    paths:
      - 'MLProject/**'
      - 'heart_preprocessing/**'
  workflow_dispatch:
    inputs:
      n_estimators:
        description: 'n_estimators'
        required: false
        default: '200'
      max_depth:
        description: 'max_depth'
        required: false
        default: '8'

jobs:
  train-and-build:
    runs-on: ubuntu-latest
    name: Train Model + Build Docker Image

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Install dependencies
        run: |
          pip install mlflow==2.19.0 scikit-learn pandas numpy matplotlib seaborn

      - name: Train model via MLflow Project
        run: |
          python MLProject/modelling.py \
            --n_estimators ${{ github.event.inputs.n_estimators || '200' }} \
            --max_depth ${{ github.event.inputs.max_depth || '8' }} \
            --train_path MLProject/heart_preprocessing/train.csv \
            --test_path MLProject/heart_preprocessing/test.csv
        env:
          MLFLOW_TRACKING_URI: mlruns

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts-${{ github.run_id }}
          path: mlruns/
          retention-days: 30

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-model:latest -f - . <<'EOF'
          FROM python:3.12-slim
          WORKDIR /app
          RUN pip install mlflow==2.19.0 scikit-learn pandas numpy
          COPY MLProject/ ./MLProject/
          COPY mlruns/ ./mlruns/ 2>/dev/null || true
          EXPOSE 5001
          CMD ["python", "MLProject/modelling.py"]
          EOF
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-model:latest

      - name: Summary
        run: |
          echo "## CI Pipeline Completed" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Train Model | Done |" >> $GITHUB_STEP_SUMMARY
          echo "| Upload Artifacts | Done |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build & Push | Done |" >> $GITHUB_STEP_SUMMARY
          echo "Docker Image: \`${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-model:latest\`" >> $GITHUB_STEP_SUMMARY
